[workspace]
resolver = "2"
members = [
    "crates/airproto",
    "crates/airbus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AirOS Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "2"
rmp-serde = "1"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
